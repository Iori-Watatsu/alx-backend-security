services:
  - type: web
    name: ip-tracking-web
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn core.wsgi:application
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: core.settings
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: CELERY_BROKER_URL
        value: ${REDIS_URL}

  - type: worker
    name: ip-tracking-celery
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A core worker -l info
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: core.settings
      - key: CELERY_BROKER_URL
        value: ${REDIS_URL}

  - type: redis
    name: ip-tracking-redis
    ipAllowList:
      - source: 0.0.0.0/0
        description: allow internal services

fromService:
  name: redis
  type: redis
  property: connectionString

ipAllowList:
  - source: 0.0.0.0/0
    description: allow internal services

